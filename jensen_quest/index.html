<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>מסע המעיל</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;800;900&family=Varela+Round&display=swap" rel="stylesheet">
<style>
:root{--ink:#1b1026;--gold:#ffd23f;--green:#76b900;--panel:#2a1640}
*{box-sizing:border-box}
html,body{margin:0}
body{background:#120a1f radial-gradient(circle at 50% 0,#4a1d6e,#120a1f 70%);color:#fff;font-family:'Varela Round',Arial,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:12px 16px}
#wrap{width:min(100%,1000px)}
#frame{position:relative;border:5px solid #0b0612;border-radius:14px 14px 0 0;overflow:hidden;box-shadow:0 0 0 3px var(--gold)}
canvas{display:block;width:100%;height:auto;background:#000;cursor:crosshair;touch-action:manipulation}
#msg{position:absolute;left:3%;right:3%;top:3%;background:#fffbea;color:var(--ink);border:4px solid var(--ink);border-radius:18px;padding:10px 16px 6px;font-size:clamp(13px,2.1vw,19px);line-height:1.5;box-shadow:6px 6px 0 var(--ink);display:none;cursor:pointer;user-select:none}
#msg .who{font-family:Rubik,sans-serif;font-weight:900;font-size:.9em}
#msg .more{font-size:11px;opacity:.55;text-align:left}
#bar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;background:linear-gradient(#5a2a86,#2a1640);border:5px solid #0b0612;border-top:3px solid var(--gold);border-radius:0 0 14px 14px;padding:8px;box-shadow:0 0 0 3px var(--gold),0 20px 50px #000a}
.vb,.slot,.tool{width:52px;height:52px;border-radius:12px;border:3px solid var(--ink);background:linear-gradient(#ffe680,#f2b705);font-size:24px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 0 var(--ink);padding:0;color:var(--ink)}
.vb.on,.slot.on{background:linear-gradient(#c8ff5a,#76b900);transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.slot{background:linear-gradient(#3a2058,#22113a);border-color:#0b0612}
.slot img{width:44px;height:44px}
#inv{display:flex;gap:6px;flex:1;min-width:120px;padding:0 8px;border-inline:2px dashed #ffffff33;min-height:52px;align-items:center}
#inv:empty::before{content:"התיק ריק";opacity:.5;font-size:13px}
#score{font-family:Rubik,sans-serif;font-weight:800;color:var(--gold);font-size:15px;text-shadow:2px 2px 0 #000;white-space:nowrap}
#parser{width:100%;margin-top:8px;padding:9px 14px;border-radius:10px;border:3px solid var(--ink);background:#fffbea;color:var(--ink);font:16px 'Varela Round',Arial,sans-serif}
.tool{background:linear-gradient(#ff9ad9,#e0469e)}
#title{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:radial-gradient(circle at 50% 40%,#7a2f9add,#120a1fee);padding:16px}
#title h1{font-family:Rubik,sans-serif;font-weight:900;font-size:clamp(28px,6.5vw,64px);margin:0;color:var(--gold);-webkit-text-stroke:2px var(--ink);text-shadow:4px 4px 0 var(--ink),0 0 30px #ff2fb0;transform:rotate(-3deg);line-height:1.1}
#title h2{font-family:Rubik,sans-serif;font-weight:800;margin:10px 0 4px;color:#c8ff5a;font-size:clamp(14px,2.6vw,24px);text-shadow:2px 2px 0 var(--ink)}
#title p{max-width:560px;font-size:clamp(12px,1.8vw,16px);opacity:.9;margin:6px 0 14px}
#title button{font-family:Rubik,sans-serif;font-weight:900;font-size:clamp(16px,2.6vw,24px);padding:10px 30px;border-radius:40px;border:4px solid var(--ink);background:linear-gradient(#c8ff5a,#76b900);box-shadow:0 5px 0 var(--ink);cursor:pointer;color:var(--ink)}
#title button:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.help{font-size:12px;opacity:.6;margin-top:8px;text-align:center}
@media (max-width:560px){.vb,.slot,.tool{width:42px;height:42px;font-size:19px}.slot img{width:36px;height:36px}}
</style>
</head>
<body>
<div id="wrap">
  <div id="frame">
    <canvas id="cv" width="1920" height="1080"></canvas>
    <div id="msg"></div>
    <div id="title">
      <h1>ג׳נסן בכנס<br>מסע המעיל</h1>
      <h2>הרפתקת הצבע‑והקלק של AI‑CON 2026</h2>
      <p>עשרים דקות לנאום המרכזי. המנכ״ל האגדי איבד את פתק המלתחה, ובלי מעיל העור אף אחד לא מאמין שזה הוא.</p>
      <button id="start">▶ התחל לשחק</button>
    </div>
  </div>
  <div id="bar">
    <button class="vb on" data-v="walk" title="הלך">🚶</button>
    <button class="vb" data-v="look" title="הסתכל">👁️</button>
    <button class="vb" data-v="take" title="קח / השתמש">✋</button>
    <button class="vb" data-v="talk" title="דבר">💬</button>
    <div id="inv"></div>
    <button class="tool" id="hint" title="רמז">💡</button>
    <button class="tool" id="snd" title="צליל">🔊</button>
    <div id="score">ניקוד: 0 מתוך 60</div>
  </div>
  <input id="parser" placeholder="הקלד פקודה... (למשל: ״דבר עם הרובוט״, ״קח כפפה״, ״תן GPU לדילן״)" autocomplete="off">
  <div class="help">בחר פעולה ולחץ על משהו בתמונה · לחץ על פריט בתיק כדי להשתמש בו · 👁️ + פריט = תיאור</div>
</div>
<script>
"use strict";
const W=960,H=540,OL="#1b1026";
const cv=document.getElementById("cv"),ctx=cv.getContext("2d");
const msgEl=document.getElementById("msg");

/* ---------- drawing helpers ---------- */
let X=ctx;
const TAU=Math.PI*2;
function P(){X.beginPath();}
function fs(fill,lw=3,stroke=OL){if(fill){X.fillStyle=fill;X.fill();}if(lw){X.lineWidth=lw;X.strokeStyle=stroke;X.lineJoin="round";X.lineCap="round";X.stroke();}}

function lg(x0,y0,x1,y1,c){const g=X.createLinearGradient(x0,y0,x1,y1);c.forEach((s,i)=>g.addColorStop(i/(c.length-1),s));return g;}

  R(-52,14,104,10,2,"#2f8a00",2.5);

  R(52,-16,7,30,2,"#c9ccd3",2);X.restore();}
function mitt(x,y,s,a=0,c="#e03131"){X.save();X.translate(x,y);X.rotate(a);X.scale(s,s);P();X.moveTo(-14,20);X.lineTo(-16,-8);X.quadraticCurveTo(-16,-30,0,-30);X.quadraticCurveTo(15,-30,13,-6);X.lineTo(22,-16);X.quadraticCurveTo(32,-9,20,5);X.lineTo(14,20);X.closePath();fs(c,2.5);R(-17,14,34,10,3,"#fff",2);line([-6,-18,-6,6],"#ffffff66",2);X.restore();}

/* ---------- characters ---------- */
const SKIN="#eebd8c";
function jensen(x,y,s,dir,ph,moving,jacket,t,pose){

  leg(-7,-sw*.42);leg(8,sw*.42);
  X.translate(0,bob);
  const arm=(ox,a)=>{X.save();X.translate(ox,-172);X.rotate(a);
    if(jacket){R(-11,0,22,84,10,"#1a1a21");line([-4,10,-4,68],"#64647a",2.2);}
    else{R(-11,0,22,32,8,"#24242b");R(-8,24,16,60,8,SKIN);}
    E(0,88,9,9,SKIN);X.restore();};
  if(pose==="raise"){arm(-26,Math.PI-.35);}else arm(-26,sw*.5);
  if(jacket){
    P();X.moveTo(-35,-182);X.quadraticCurveTo(0,-194,35,-182);X.lineTo(32,-84);X.quadraticCurveTo(0,-78,-32,-84);X.closePath();fs("#16161c");
    poly([-12,-186,12,-186,3,-140,-3,-140],"#2b2b33",2);
    poly([-12,-186,-27,-182,-6,-128],"#25252f",2);poly([12,-186,27,-182,6,-128],"#25252f",2);
    X.strokeStyle="#6d6d84";X.lineWidth=2.6;P();X.moveTo(-26,-168);X.quadraticCurveTo(-31,-128,-24,-94);X.moveTo(22,-160);X.quadraticCurveTo(25,-130,20,-104);X.stroke();
    line([5,-128,5,-86],"#cfd0db",1.6);
    X.strokeStyle="#ffffff30";X.lineWidth=5;P();X.moveTo(-18,-170);X.quadraticCurveTo(-22,-150,-16,-130);X.stroke();
  }else{
    P();X.moveTo(-28,-182);X.quadraticCurveTo(0,-190,28,-182);X.lineTo(26,-84);X.quadraticCurveTo(0,-80,-26,-84);X.closePath();fs("#24242b");
    P();X.moveTo(0,-128);X.bezierCurveTo(-12,-140,-10,-154,0,-146);X.bezierCurveTo(10,-154,12,-140,0,-128);fs("#76b900",1.5);
  }

  R(-9,-200,20,22,5,"#e3ad7c");
  E(4,-226,31,35,SKIN);
  E(-25,-222,6,9,"#e3ad7c",2.5);
  P();X.moveTo(-31,-214);X.bezierCurveTo(-40,-264,12,-280,37,-246);X.bezierCurveTo(28,-252,10,-252,-2,-246);X.bezierCurveTo(-14,-240,-20,-232,-21,-212);X.closePath();fs("#33333b");
  X.strokeStyle="#a9a9b8";X.lineWidth=3;P();X.moveTo(-27,-236);X.bezierCurveTo(-20,-260,6,-268,29,-252);X.stroke();
  X.strokeStyle="#55555f";X.lineWidth=2;P();X.moveTo(-24,-226);X.bezierCurveTo(-16,-250,4,-258,20,-252);X.stroke();
  X.strokeStyle=OL;X.lineWidth=3;line([7,-238,19,-240],OL,3);line([25,-240,33,-236],OL,3);
  const blink=(t%3.7)<.12;
  if(blink){line([9,-227,18,-227],OL,2.5);line([25,-227,32,-227],OL,2.5);}
  else{X.lineWidth=3;P();X.arc(13.5,-224,5,Math.PI*1.1,Math.PI*1.9);X.stroke();P();X.arc(28.5,-224,4.5,Math.PI*1.1,Math.PI*1.9);X.stroke();}
  line([4,-222,7,-219],"#c98e5f",1.5);
  P();X.moveTo(33,-224);X.quadraticCurveTo(43,-212,33,-207);fs(null,2.5);
  P();X.moveTo(6,-202);X.quadraticCurveTo(22,-182,36,-200);X.quadraticCurveTo(22,-195,6,-202);fs("#fff",2.5);
  X.fillStyle="rgba(230,90,90,.25)";P();X.ellipse(10,-210,7,4,0,0,TAU);X.fill();
  if(pose==="raise")gpu(0,-292,.7);
  X.restore();
}
function person(x,y,s,o,t=0){
  X.save();X.translate(x,y);X.scale(s*(o.flip?-1:1),s);
  const w=o.w||28,b=Math.sin(t*2+(o.ph||0))*1.4,skin=o.skin||"#f0c49a";
  shadow(0,0,w+10);
  R(-w*.6,-92,w*.55,90,7,o.pants||"#2b3a67");R(w*.05,-92,w*.55,90,7,o.pants||"#2b3a67");
  E(-w*.34,-4,w*.5,7,o.shoe||"#111");E(w*.34,-4,w*.5,7,o.shoe||"#111");
  X.translate(0,b);
  R(-w-14,-178,17,82,8,o.sleeve||o.top);E(-w-5.5,-94,8,8,skin);
  R(w-3,-178,17,82,8,o.sleeve||o.top);E(w+5.5,-94,8,8,skin);
  P();X.moveTo(-w-2,-182);X.quadraticCurveTo(0,-192,w+2,-182);X.lineTo(w*.9,-86);X.quadraticCurveTo(0,-80,-w*.9,-86);X.closePath();fs(o.top);
  o.chest&&o.chest(t);
  R(-8,-198,16,20,4,skin);
  E(0,-224,o.hw||27,31,skin);
  E(-o.hw-2||-29,-222,5,8,skin,2.5);E((o.hw||27)+2,-222,5,8,skin,2.5);
  o.under&&o.under(t);
  const bl=((t+(o.ph||0))%4)<.13;
  if(bl){line([-13,-224,-5,-224],OL,2.5);line([5,-224,13,-224],OL,2.5);}else{E(-9,-225,3.2,4.2,OL,0);E(9,-225,3.2,4.2,OL,0);E(-8,-226.5,1,1,"#fff",0);E(10,-226.5,1,1,"#fff",0);}
  P();X.moveTo(0,-220);X.quadraticCurveTo(4,-212,-1,-210);fs(null,2);
  if(o.mouth)o.mouth(t);else{P();X.arc(0,-207,8,.25*Math.PI,.75*Math.PI);fs(null,2.5);}

/* NPC styles */
function bigMike(x,y,s,t){person(x,y,s,{w:40,top:"#18181c",pants:"#2a2a30",skin:"#9a6440",hw:30,ph:1,

  under(){P();X.moveTo(-24,-214);X.quadraticCurveTo(0,-176,24,-214);X.quadraticCurveTo(0,-198,-24,-214);fs("#2a1a10",2);line([-14,-236,-4,-233],OL,4);line([4,-233,14,-236],OL,4);},

function dylan(x,y,s,t,happy){person(x,y,s,{w:24,top:"#9aa3ad",pants:"#3b4a6b",shoe:"#f1f3f5",skin:"#f3cba5",ph:2.2,flip:false,
  chest(){P();X.moveTo(-22,-178);X.lineTo(-10,-176);X.lineTo(-8,-90);X.lineTo(-22,-88);X.closePath();fs("#1e2a4a",2);P();X.moveTo(22,-178);X.lineTo(10,-176);X.lineTo(8,-90);X.lineTo(22,-88);X.closePath();fs("#1e2a4a",2);line([-21,-150,-9,-150],"#33456e",2);line([21,-150,9,-150],"#33456e",2);line([-21,-125,-9,-125],"#33456e",2);line([21,-125,9,-125],"#33456e",2);},

  head(){for(const[cx,cy]of[[-20,-244],[-8,-254],[6,-256],[18,-248],[25,-234],[-26,-232]])E(cx,cy,10,10,"#6b3b1a",2);},
  front(){poly([-30,-112,30,-112,24,-104,-24,-104],"#c9ccd3",2.5);P();X.moveTo(-26,-112);X.lineTo(-20,-146);X.lineTo(20,-146);X.lineTo(26,-112);X.closePath();fs("#dfe2e8",2.5);txt("🚀",0,-130,12,"#000",{dir:"ltr"});}},t);}
function attendant(x,y,s,t){person(x,y,s,{w:24,top:"#c2185b",skin:"#f2c9a0",ph:.6,
  chest(){poly([-8,-184,8,-184,0,-160],"#fff",2);poly([-9,-180,0,-174,-9,-168],"#1b1026",1.5);poly([9,-180,0,-174,9,-168],"#1b1026",1.5);},
  under(){},
  head(){P();X.ellipse(0,-234,29,22,0,Math.PI*1.02,Math.PI*1.98);fs("#5a2a12",2.5);E(0,-262,13,11,"#5a2a12",2.5);E(-9,-213,5,3,"rgba(230,90,120,.35)",0);E(9,-213,5,3,"rgba(230,90,120,.35)",0);line([-14,-233,-5,-235],OL,2);line([5,-235,14,-233],OL,2);}},t);}
function crowdHead(x,y,s,c,t,ph,arm){X.save();X.translate(x,y+Math.sin(t*6+ph)*3);X.scale(s,s);
  if(arm){X.save();X.rotate(Math.sin(t*5+ph)*.3);R(14,-90,12,60,6,c,2.5);E(20,-92,8,8,"#d9a77c",2);if(arm===2){R(13,-112,14,22,3,"#222",2);R(15,-110,10,16,2,"#9ef",0);}X.restore();}
  E(0,0,34,26,c,3);E(0,-40,20,22,["#d9a77c","#8d5a3b","#f0c49a","#c58c5c"][Math.abs(ph*7|0)%4],3);P();X.ellipse(0,-48,21,16,0,Math.PI,0);fs(["#2b1a10","#111","#7a4a20","#e8c070"][Math.abs(ph*5|0)%4],2.5);X.restore();}

/* ---------- background builders (pre-rendered) ---------- */
function mkCanvas(){const c=document.createElement("canvas");c.width=W*2;c.height=H*2;const g=c.getContext("2d");g.scale(2,2);return[c,g];}
function bgLobby(){

        use:i=>i==="gpu"?[SLEEPY("zzz... תשאיר אותו ליד ה‑cluster... zzz..."),"אבל את ה‑GPU הזה ג׳נסן עוד צריך. הוא מחזיר אותו לכיס, בזהירות."]:i==="mitt"?["ג׳נסן מניח את הכפפה מתחת לראשה כמו כרית. היא מחייכת בשינה. ואז הוא לוקח אותה בחזרה."]:null},
      {id:"bar",name:"בר",al:["בר","קומבוצ","משקה","שתייה"],r:[90,160,235,225],w:[210,412],look:"בר VIP. קומבוצ׳ה מהחבית, מים ממקור ״דאטה סנטר ירוק״ וקפה שמזמין לך AI agent.",take:"ג׳נסן מוזג קומבוצ׳ה. טעם של סטארטאפ: חמוץ, תוסס ומוערך יתר על המידה.",talk:()=>[J("ברמן?"),"אין ברמן. רק שלט: ״השירות ניתן ע״י agent. זמן תגובה ממוצע: 3 עד 40 דקות״."]},
      {id:"window",name:"חלון",al:["חלון","נוף","עיר"],r:[380,66,260,150],w:null,look:"נוף לעמק הסיליקון בלילה. כל נקודת אור שם היא דאטה סנטר. רובם, איכשהו, קשורים אליו."},
      {id:"vip",name:"שלט VIP",al:["שלט"],r:[690,52,180,86],w:null,look:"שלט ניאון: VIP. Very Important Processors. בני אדם מוזמנים לחכות בחוץ."},
      {id:"exit",name:"לאולם התצוגה",al:["תצוגה","אקספו","expo","יציאה","שמאלה"],r:[0,130,74,255],w:[28,430],exit:["expo",860,430],look:"חזרה לאולם התצוגה."}
    ]},
  stage:{floor:{l:480,r:480,t:372,b:372},s:[.72,.72],
    actors:t=>[],
    dyn(t){for(const[bx,c,ph]of[[160,"rgba(255,122,224,.18)",0],[480,"rgba(255,255,220,.22)",1],[800,"rgba(124,244,255,.18)",2]]){const a=Math.sin(t*1.2+ph)*.35;X.save();X.translate(bx,0);X.rotate(a);X.fillStyle=c;P();X.moveTo(-12,0);X.lineTo(12,0);X.lineTo(120,560);X.lineTo(-120,560);X.fill();X.restore();}
      jensen(480,372,.72,1,0,false,true,t,"raise");
      for(let i=0;i<14;i++)crowdHead(30+i*70,520+(i%2)*6,.9,["#3a5a8a","#8a3a5a","#4a7a3a","#6a4a8a","#8a6a2a"][i%5],t,i*.7,i%3===0?1:i%4===1?2:0);
      conf.forEach(c=>{c.y+=c.v;c.a+=.05;if(c.y>H)c.y=-10;X.save();X.translate(c.x+Math.sin(c.a)*10,c.y);X.rotate(c.a);X.fillStyle=c.c;X.fillRect(-4,-2,8,4);X.restore();});},
    hs:[]}
};
function sleeper(t){X.save();P();X.moveTo(360,480);X.bezierCurveTo(350,420,420,405,470,412);X.bezierCurveTo(530,418,540,470,520,490);X.quadraticCurveTo(440,505,360,480);fs("#7b3fd1",3);
  X.strokeStyle="#ffffff30";X.lineWidth=5;P();X.moveTo(380,450);X.quadraticCurveTo(400,425,440,420);X.stroke();
  R(420,436,110,28,14,"#2bb3a3",3);R(500,446,70,18,9,"#2b3a67",3);E(574,456,10,7,"#111",2.5);
  E(398,426,22,20,"#f0c49a",3);P();X.ellipse(392,420,22,16,-.4,Math.PI*.9,Math.PI*2.05);fs("#3b2414",2.5);line([396,428,404,428],OL,2);line([408,428,414,427],OL,2);E(406,436,3,2,"#5a1020",1.5);
  R(436,422,46,6,2,"#c9ccd3",2);P();X.moveTo(438,422);X.lineTo(446,396);X.lineTo(486,396);X.lineTo(480,422);X.closePath();fs("#dfe2e8",2.5);
  X.fillStyle=`rgba(124,244,255,${.4+Math.sin(t*4)*.2})`;P();X.moveTo(447,400);X.lineTo(483,400);X.lineTo(478,419);X.lineTo(442,419);X.fill();
  for(let k=0;k<3;k++){const p=((t*.5+k/3)%1);txt("Z",400+p*40+k*4,400-p*70,12+p*14,`rgba(255,255,255,${1-p})`,{dir:"ltr",w:900,o:3,oc:`rgba(27,16,38,${1-p})`});}
  X.restore();}
function ovenTake(){if(S.f.oven)return[J("התנור ריק. אפיתי כבר את כל מה שאפשר.")];
  if(!S.f.mitt)return["ג׳נסן פותח את התנור ומושיט יד חשופה לעבר ה‑GPU.",J("אאוץ׳! אאוץ׳! זה 700 וואט!"),"ג׳נסן מנפנף ביד ונושף עליה. כדאי למצוא משהו שיגן על הידיים."];
  say(["ג׳נסן עוטה את כפפת התנור, פותח את הדלת, ובתנועה דרמטית שולף מגש ועליו שני כרטיסים גרפיים מהבילים.",J("טריים מהתנור. בדיוק כמו בפעם ההיא במטבח.")],()=>{S.f.oven=1;S.gpus=2;addScore(10);});return true;}

/* ---------- core loop ---------- */
function room(){return ROOMS[S.room];}
function scaleAt(y){const r=room(),f=r.floor;const k=f.b===f.t?0:(y-f.t)/(f.b-f.t);return r.s[0]+(r.s[1]-r.s[0])*Math.max(0,Math.min(1,k));}
function goRoom(id,x,y,cb){S.fade=1;S.room=id;S.x=S.tx=x;S.y=S.ty=y;S.moving=false;S.pending=null;S.dir=x>480?-1:1;tone(220,.15,"triangle",.05);cb&&cb();}
function walkTo(x,y,cb){const f=room().floor;S.tx=Math.max(f.l,Math.min(f.r,x));S.ty=Math.max(f.t,Math.min(f.b,y));S.pending=cb||null;
  if(Math.hypot(S.tx-S.x,S.ty-S.y)<2){S.moving=false;S.pending=null;cb&&cb();}else S.moving=true;}
function hitJensen(x,y){const s=scaleAt(S.y);return Math.abs(x-S.x)<30*s/.7&&y<S.y&&y>S.y-270*s;}
function hotspotAt(x,y){return room().hs.find(h=>x>=h.r[0]&&x<=h.r[0]+h.r[2]&&y>=h.r[1]&&y<=h.r[1]+h.r[3])||null;}
function handle(v,def){let r=v;if(typeof r==="function")r=r();if(r===true)return;if(r==null)r=def;if(r!=null)say(r);}
function act(h,verb,item){
  if(verb==="look"){handle(h.look,DEF.look[0]);return;}
  const run=()=>{if(h.w){const cx=h.r[0]+h.r[2]/2;if(Math.abs(cx-S.x)>8)S.dir=cx>S.x?1:-1;}
    if(h.exit&&verb!=="item"){goRoom(...h.exit);return;}
    if(verb==="take")handle(h.take,J(pick(DEF.take)));
    else if(verb==="talk")handle(h.talk,J(pick(DEF.talk)));
    else if(verb==="item")handle(h.use?()=>h.use(item):null,J(pick(DEF.item)));
    else if(verb==="walk"&&!h.w){}};
  if(h.w)walkTo(h.w[0],h.w[1],run);else run();
}
function selfAct(verb,item){
  if(verb==="look")say(S.f.jacket?"זה ג׳נסן. מנכ״ל. חזון. מעיל עור. הכל במקום.":"זה ג׳נסן. מנכ״ל. חזון. חיוך של טריליון דולר. ובלי מעיל עור, הוא נראה כמו אבא בטיול שנתי.");
  else if(verb==="talk")say([J("ג׳נסן, אתה גאון."),J("תודה, ג׳נסן.")]);
  else if(verb==="take")say("ג׳נסן מאסף את עצמו. רגשית.");
  else if(verb==="item")say(item==="mitt"?[J("אני לא צריך כפפה. הידיים שלי לא חמות. רק המניה.")]:item==="gpu"?["ג׳נסן מצמיד את ה‑GPU ללחי. חם ונעים. הוא כמעט רוגע."]:item==="badge"?["ג׳נסן מתקן את התג על החזה. מושלם."]:[J("אני לא מלתחה.")]);
}
function onClick(x,y){
  if(!S.started||S.ended&&!msgOpen)return;
  if(msgOpen){next();return;}
  const v=S.verb;
  if(v!=="walk"&&hitJensen(x,y)){selfAct(v,S.item);return;}
  const h=hotspotAt(x,y);
  if(h){act(h,v,S.item);return;}
  if(v==="walk"){walkTo(x,y);return;}
  if(v==="look")say(pick(["רצפה. מאוד רצפתית.","אין שם כלום. בדקתי פעמיים, ופעם שלישית עם מודל.","אוויר. ממוזג היטב, על חשבון המשקיעים."]));
  else if(v==="item")say(J("לא שם."));
  else walkTo(x,y);
}
let last=0;
function frame(ts){
  const dt=Math.min(.05,(ts-last)/1000||0);last=ts;S.t=ts/1000;
  if(S.moving){const dx=S.tx-S.x,dy=S.ty-S.y,d=Math.hypot(dx,dy),spd=200*scaleAt(S.y)*dt;
    if(Math.abs(dx)>1)S.dir=dx>0?1:-1;
    if(d<=spd){S.x=S.tx;S.y=S.ty;S.moving=false;const p=S.pending;S.pending=null;p&&p();}
    else{S.x+=dx/d*spd;S.y+=dy/d*spd;S.ph+=dt*11;}}
  X=ctx;X.setTransform(2,0,0,2,0,0);
  if(BG[S.room])X.drawImage(BG[S.room],0,0,W,H);
  const r=room();r.dyn&&r.dyn(S.t);
  if(S.room!=="stage"){const acts=r.actors(S.t).concat([{y:S.y,d:()=>jensen(S.x,S.y,scaleAt(S.y),S.dir,S.ph,S.moving,!!S.f.jacket,S.t)}]);acts.sort((a,b)=>a.y-b.y).forEach(a=>a.d());}
  X.drawImage(VIG,0,0,W,H);
  if(!msgOpen&&S.started&&!S.ended&&S.mx>=0){let label=null;const h=hotspotAt(S.mx,S.my);
    if(S.verb!=="walk"&&hitJensen(S.mx,S.my))label="ג׳נסן";else if(h)label=h.name;
    const vt={walk:"לך אל",look:"הסתכל על",take:"קח",talk:"דבר עם",item:"השתמש ב"+(S.item?ITEMS[S.item].name:"")+" על"}[S.verb];
    const s=label?`${vt} ${label}`:(S.verb==="item"?vt+"...":null);
    cv.style.cursor=label?"pointer":"crosshair";
    if(s){X.font="800 15px Rubik,Arial";X.direction="rtl";const w=X.measureText(s).width+20;let lx=Math.min(W-w-6,Math.max(6,S.mx-w/2)),ly=S.my-44<4?S.my+24:S.my-44;R(lx,ly,w,28,14,"#fffbea",3);txt(s,lx+w/2,ly+14,15,OL);}}
  if(S.fade>0){X.fillStyle=`rgba(0,0,0,${S.fade})`;X.fillRect(0,0,W,H);S.fade=Math.max(0,S.fade-dt*2.5);}
  requestAnimationFrame(frame);
}
let VIG;
function buildAll(){const mk=f=>{const[c,g]=mkCanvas();const o=X;X=g;f();X=o;return c;};
  BG.lobby=mk(bgLobby);BG.expo=mk(bgExpo);BG.lounge=mk(bgLounge);BG.stage=mk(bgStage);
  VIG=mk(()=>{const g=X.createRadialGradient(W/2,H/2,H*.35,W/2,H/2,H*.95);g.addColorStop(0,"rgba(0,0,0,0)");g.addColorStop(1,"rgba(10,0,20,.45)");X.fillStyle=g;X.fillRect(0,0,W,H);});}

/* ---------- input ---------- */
function pos(e){const b=cv.getBoundingClientRect();return[(e.clientX-b.left)/b.width*W,(e.clientY-b.top)/b.height*H];}
cv.addEventListener("click",e=>{const[x,y]=pos(e);onClick(x,y);});
cv.addEventListener("mousemove",e=>{[S.mx,S.my]=pos(e);});
cv.addEventListener("mouseleave",()=>{S.mx=-1;});
cv.addEventListener("contextmenu",e=>{e.preventDefault();const o=["walk","look","take","talk"];setVerb(o[(o.indexOf(S.verb)+1)%4]);});
document.querySelectorAll(".vb").forEach(b=>b.onclick=()=>{if(msgOpen){next();return;}setVerb(b.dataset.v);});
document.addEventListener("keydown",e=>{if(e.target.id==="parser")return;if(msgOpen&&[" ","Enter","Escape"].includes(e.key)){e.preventDefault();next();}});
document.getElementById("hint").onclick=()=>{if(!S.started||S.ended)return;if(msgOpen){next();return;}say(hint());};
document.getElementById("snd").onclick=e=>{S.sound=!S.sound;e.currentTarget.textContent=S.sound?"🔊":"🔇";};
function hint(){const f=S.f;
  if(f.badge)return"💡 ביג מייק בלובי מחכה. יש לך תג ויש לך דמו. לך תהיה אגדה.";
  if(f.jacket)return"💡 עכשיו כשאתה נראה כמו עצמך, נסה שוב לדבר עם רובוט הרישום.";
  if(f.ticket)return"💡 בחר את הפתק בתיק ולחץ על דורית מהמלתחה.";
  if(S.gpus>0)return f.metDylan?"💡 דילן באולם התצוגה רוצה GPU. בחר את הכרטיסים בתיק ולחץ עליו.":"💡 מישהו באולם התצוגה מצא משהו ששייך לך. דבר עם האנשים שם.";
  if(f.mitt)return"💡 בטרקלין ה‑VIP יש תנור חם מאוד. ויש לך כפפה...";
  if(f.metDylan)return"💡 דילן רוצה GPU. המכונה האוטומטית ריקה... אבל אולי מישהו אופה כאלה? ותצטרך להגן על הידיים.";
  return"💡 התחל בלדבר עם כולם: הרובוט, דורית מהמלתחה וביג מייק. ואז צא לאולם התצוגה (מימין).";}
const parser=document.getElementById("parser");
parser.addEventListener("keydown",e=>{if(e.key!=="Enter")return;e.preventDefault();if(msgOpen){next();return;}const s=parser.value;parser.value="";if(S.started&&!S.ended)parse(s);});
function parse(raw){const s=raw.trim().toLowerCase();if(!s)return;
  const has=a=>a.some(w=>s.includes(w));
  if(has(["רמז","עזרה","help"]))return say(hint());
  if(has(["רקוד","ריקוד","dance"]))return say("ג׳נסן מבצע ריקוד קטן. אף אחד לא מתרשם. המניה בכל זאת עולה ב‑3%.");
  if(has(["קנה","buy"]))return say(J("ככל שתקנו יותר — תחסכו יותר!"));
  if(has(["מלאי","תיק","inventory"]))return say(invList().length?"בתיק: "+invList().map(i=>ITEMS[i].name).join(", ")+".":"התיק ריק. כמו הוויכוח על AGI.");
  if(has(["ניקוד","score"]))return say(`ניקוד: ${S.score} מתוך ${MAXSCORE}.`);
  let verb=has(["תן","הבא","השתמש","הפעל","הראה","give","use"])?"item":has(["הסתכל","בדוק","הבט","תאר","look"])?"look":has(["דבר","שוחח","שאל","talk"])?"talk":has(["קח","הרם","פתח","לקח","take","open","get"])?"take":has(["לך","זוז","צא","walk","go"])?"walk":null;
  const item=invList().find(i=>ITEMS[i].al.some(a=>s.includes(a)));
  const h=room().hs.find(h=>h.al.some(a=>s.includes(a)));
  if(verb==="item"&&item&&h)return act(h,"item",item);
  if(verb==="item"&&h&&!item)return act(h,"take");
  if(item&&!h&&(verb==="look"||!verb)){const d=ITEMS[item].desc;return say(typeof d==="function"?d():d);}
  if(item&&h&&!verb)return act(h,"item",item);
  if(h&&verb)return act(h,verb==="walk"?(h.exit?"walk":"walk"):verb);
  if(h&&!verb)return act(h,"look");
  if(verb==="look")return say(pick(["אתה בלובי של כנס AI. הכל נוצץ, הכל מואץ, וכולם מדברים על agents.","הכל נראה כמו כנס AI. כלומר: הרבה ניאון, מעט שינה."]));
  say(pick([J("לא הבנתי. ואני בניתי את רוב החומרה שמבינה דברים."),"המספר לא מכיר את המילה הזאת. נסה ״הסתכל״, ״קח״, ״דבר עם״ או ״תן X ל‑Y״.",J("אולי תנסח את זה כמו prompt?")]));}

document.getElementById("start").onclick=()=>{document.getElementById("title").style.display="none";S.started=true;tone(440,.1);setTimeout(()=>tone(660,.15),100);
  say(["סן חוזה, כנס AI‑CON 2026. עשרים דקות לפני הנאום המרכזי.",J("רגע. איפה מעיל העור שלי?!"),"ג׳נסן הפקיד את המעיל במלתחה... והפתק נעלם. בלי מעיל העור, אף אחד לא יאמין שזה באמת הוא.",J("בלי המעיל אני סתם בחור בג׳ינס שמדבר על טרנספורמרים."),"(בחר פעולה בסרגל למטה ולחץ על דברים בתמונה. אפשר גם להקליד פקודות. כפתור 💡 נותן רמז. לחיצה ימנית מחליפה פעולה.)"]);};

const ready=document.fonts&&document.fonts.ready?Promise.race([document.fonts.ready,new Promise(r=>setTimeout(r,1500))]):Promise.resolve();
ready.then(()=>{buildAll();renderInv();requestAnimationFrame(frame);});
